name: Gerar EXE Windows

on:
  push:
    branches:
      - main
      - claude/budget-cover-automation-qjkemj
      - claude/egemap-proposal-monitor-zw7dzh
      - claude/automacao-adicional-lshf3u
      - claude/egemap-proposal-monitor-dp611t
      - claude/automate-pdf-orders-crm-vgkgkb
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # A versao do PyMuPDF fica PRESA de proposito. Em 22/10/2026 o
      # "pip install pymupdf" pegou sozinho o 2.0, lancado tres dias antes,
      # que traz um pacote novo (pymupdf.layout) com arquivos de modelo que o
      # PyInstaller nao empacota. O .exe publicado nem abria: quebrava no
      # "import fitz". A 1.28.2 e a que rodou por semanas na maquina do
      # Natanael. Pra subir de versao: trocar aqui e CONFERIR o .exe abrindo.
      - name: Instalar dependências
        run: |
          pip install "pymupdf==1.28.2" watchdog pyinstaller

      - name: Gerar EXE
        run: |
          pyinstaller --onefile --name "EGEMAP-Monitor" --add-data "DMSans-Regular.ttf;." --add-data "NewsCycle-Bold.ttf;." --hidden-import crm --hidden-import drive --hidden-import limpar_drive --hidden-import pedidos monitorar.py

      # Confere que o .exe ABRE antes de publicar. Sem isto, uma versao que
      # nem inicia vira release e chega no Natanael.
      - name: Conferir que o EXE abre
        run: |
          dist\EGEMAP-Monitor.exe --teste
          if ($LASTEXITCODE -ne 0) { throw "O EXE nao abriu" }

      - name: Publicar EXE como artefato
        uses: actions/upload-artifact@v4
        with:
          name: EGEMAP-Monitor-Windows
          path: dist/EGEMAP-Monitor.exe
          retention-days: 90

      # Deixa o EXE baixavel por um link fixo, sem zip e sem procurar na
      # pagina do Actions:
      #   .../releases/latest/download/EGEMAP-Monitor.exe
      - name: Publicar release com o EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "monitor-${{ github.run_number }}" dist/EGEMAP-Monitor.exe `
            --target "${{ github.sha }}" `
            --title "EGEMAP-Monitor (build ${{ github.run_number }})" `
            --notes "Baixe o EGEMAP-Monitor.exe aqui embaixo e abra. Ele pergunta o que precisa na primeira vez."

